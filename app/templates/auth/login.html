<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="../../static/css/auth/login.css">
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h2>Đăng Nhập</h2>
        </div>

        <form>
            <div class="input-group">
                <label>Tài khoản</label>
                <input type="text" placeholder="Nhập email hoặc username..." required>
            </div>

            <div class="input-group">
                <label>Mật khẩu</label>
                <input type="password" placeholder="Nhập mật khẩu..." required>
            </div>

            <div class="forgot-password">
                <a href="#">Quên mật khẩu?</a>
            </div>

            <button type="submit" class="btn-submit">Đăng nhập</button>
        </form>

        <div class="social-login">
            <p>Hoặc đăng nhập bằng</p>
            <div class="social-buttons">
                <button class="btn-social">Google</button>
                <button class="btn-social">Github</button>
            </div>
        </div>

        <div class="signup-link">
            Chưa có tài khoản? <a href="#">Tạo tài khoản</a>
        </div>

        <div class="footer-policy">
            Bằng cách đăng nhập, og đồng ý với <a href="#">Điều khoản dịch vụ</a> và <a href="#">Chính sách bảo mật</a> của chúng tôi.
        </div>
    </div>

</body>
</html>
